    * {

      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: linear-gradient(135deg, #0a0f1e 0%, #0c1222 100%);
      font-family: 'Segoe UI', 'Inter', system-ui, -apple-system, sans-serif;
      padding: 2rem 1.5rem;
      min-height: 100vh;
    }

    /* header section */
    .header {
      text-align: center;
      margin-bottom: 2.5rem;
    }
    .header h1 {
      font-size: 2.6rem;
      background: linear-gradient(135deg, #f5e6b2, #ffcc66, #ffaa33);
      background-clip: text;
      -webkit-background-clip: text;
      color: transparent;
      letter-spacing: 2px;
      text-shadow: 0 2px 8px rgba(0,0,0,0.3);
      margin-bottom: 0.5rem;
    }
    .header p {
      color: #8e9bbe;
      font-size: 0.95rem;
      border-top: 1px solid rgba(255,204,102,0.3);
      display: inline-block;
      padding-top: 0.5rem;
    }

    /* filter / search bar */
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 1rem;
      margin-bottom: 2.5rem;
      align-items: center;
    }
    .search-box {
      background: rgba(20, 28, 48, 0.8);
      backdrop-filter: blur(6px);
      border: 1px solid rgba(255, 204, 102, 0.35);
      border-radius: 60px;
      padding: 0.5rem 1.2rem;
      display: flex;
      align-items: center;
      gap: 0.7rem;
      transition: all 0.2s;
    }
    .search-box:focus-within {
      border-color: #ffcc66;
      box-shadow: 0 0 12px rgba(255,204,102,0.2);
    }
    .search-box span {
      font-size: 1.2rem;
    }
    #searchInput {
      background: transparent;
      border: none;
      color: #f0e6d0;
      font-size: 0.9rem;
      width: 240px;
      outline: none;
    }
    #searchInput::placeholder {
      color: #6a7a9e;
    }
    .stats-badge {
      background: #1e2a3a;
      padding: 0.4rem 1rem;
      border-radius: 40px;
      font-size: 0.8rem;
      color: #ffdd99;
      font-weight: 500;
      border: 1px solid #ffcc6640;
    }
    .stats-badge span {
      color: white;
      font-weight: bold;
      margin: 0 4px;
    }

    /* EXTERNAL LINK BUTTON - GBA Extended */
    .external-link-card {
      background: linear-gradient(115deg, rgba(25, 34, 55, 0.9), rgba(18, 24, 42, 0.95));
      border-radius: 24px;
      padding: 1rem 1.5rem;
      margin-bottom: 2rem;
      border: 1px solid rgba(255, 204, 102, 0.3);
      transition: all 0.3s ease;
      text-align: center;
      max-width: 600px;
      margin-left: auto;
      margin-right: auto;
    }
    .external-link-card:hover {
      transform: translateY(-3px);
      border-color: #ffcc66;
      background: linear-gradient(115deg, #1e2a44, #141c30);
      box-shadow: 0 14px 28px -8px rgba(0,0,0,0.5);
    }
    .external-link {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      background: linear-gradient(135deg, #ffcc66, #ffaa33);
      color: #1a1f2e;
      padding: 10px 24px;
      border-radius: 60px;
      text-decoration: none;
      font-weight: 800;
      font-size: 1rem;
      transition: all 0.2s;
      box-shadow: 0 4px 12px rgba(255, 204, 102, 0.3);
    }
    .external-link:hover {
      transform: scale(1.02);
      background: linear-gradient(135deg, #ffdd88, #ffbb44);
      box-shadow: 0 6px 18px rgba(255, 204, 102, 0.5);
    }
    .external-link span {
      font-size: 1.3rem;
    }
    .link-description {
      color: #93a5cf;
      margin-top: 8px;
      font-size: 0.75rem;
    }

    /* game grid — modern button cards */
    .games-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1.2rem;
      max-width: 1400px;
      margin: 0 auto;
    }

    /* game button (card style) */
    .game-btn {
      display: flex;
      align-items: center;
      gap: 1rem;
      background: linear-gradient(115deg, rgba(25, 34, 55, 0.9), rgba(18, 24, 42, 0.95));
      backdrop-filter: blur(2px);
      border: 1px solid rgba(255, 204, 102, 0.25);
      border-radius: 24px;
      padding: 0.9rem 1.2rem;
      text-decoration: none;
      transition: all 0.25s cubic-bezier(0.2, 0.9, 0.4, 1.1);
      cursor: pointer;
      position: relative;
      overflow: hidden;
    }
    .game-btn::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,204,102,0.12), transparent);
      transition: left 0.4s ease;
    }
    .game-btn:hover::before {
      left: 100%;
    }
    .game-btn:hover {
      transform: translateY(-4px) scale(1.01);
      border-color: #ffcc66;
      background: linear-gradient(115deg, #1e2a44, #141c30);
      box-shadow: 0 14px 28px -8px rgba(0,0,0,0.5), 0 0 0 1px rgba(255,204,102,0.2) inset;
    }
    /* icon + emoji style */
    .game-icon {
      font-size: 2rem;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3));
      min-width: 52px;
      text-align: center;
    }
    .game-info {
      flex: 1;
    }
    .game-title {
      font-weight: 700;
      font-size: 0.95rem;
      color: #f5e6c4;
      letter-spacing: -0.2px;
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }
    .game-badge {
      background: rgba(255, 204, 102, 0.18);
      font-size: 0.6rem;
      padding: 2px 8px;
      border-radius: 20px;
      color: #ffdd99;
      font-weight: normal;
    }
    .game-sub {
      font-size: 0.7rem;
      color: #93a5cf;
      margin-top: 4px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .arrow-hint {
      opacity: 0.5;
      font-size: 0.8rem;
      transition: 0.2s;
    }
    .game-btn:hover .arrow-hint {
      opacity: 1;
      transform: translateX(3px);
      color: #ffcc66;
    }

    /* category chips */
    .category-bar {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.6rem;
      margin-bottom: 2rem;
    }
    .cat-chip {
      background: rgba(20, 28, 48, 0.7);
      border: 1px solid rgba(255,204,102,0.3);
      border-radius: 40px;
      padding: 0.3rem 1rem;
      font-size: 0.75rem;
      font-weight: 500;
      color: #cbd5ee;
      cursor: pointer;
      transition: all 0.15s;
    }
    .cat-chip.active {
      background: #ffcc66;
      color: #1a1f2e;
      border-color: #ffdd99;
      font-weight: bold;
      box-shadow: 0 2px 8px rgba(255,204,102,0.3);
    }
    .cat-chip:hover {
      background: rgba(255,204,102,0.2);
      color: #ffeaaf;
    }

    /* footer */
    .footer {
      text-align: center;
      margin-top: 3rem;
      font-size: 0.7rem;
      color: #5c6e8c;
      border-top: 1px solid rgba(255,204,102,0.15);
      padding-top: 1.8rem;
    }

    /* no results message */
    .no-results {
      text-align: center;
      grid-column: 1 / -1;
      padding: 3rem;
      background: rgba(0,0,0,0.2);
      border-radius: 48px;
      color: #9eafcf;
    }

    @media (max-width: 640px) {
      body {
        padding: 1rem;
      }
      .games-grid {
        grid-template-columns: 1fr;
      }

      }
      .external-link {
        padding: 8px 18px;
        font-size: 0.85rem;
      }
    }
  </style>
</head>

  // helper: get dynamic badge (series hint)
  function getBadgeText(title) {
    if (title.includes("Pokemon")) return "Pokémon";
    if (title.includes("Mario")) return "Mario";
    if (title.includes("Zelda")) return "Zelda";
    if (title.includes("Final Fantasy")) return "FF";
    if (title.includes("Megaman")) return "Mega Man";
    if (title.includes("Sonic")) return "Sonic";
    if (title.includes("Kirby")) return "Kirby";
    if (title.includes("F-Zero")) return "F-Zero";
    if (title.includes("Fire Emblem")) return "Fire Emblem";
    return "GBA";
  }

  // render container
  const container = document.getElementById("gamesContainer");
  const searchInput = document.getElementById("searchInput");
  const totalSpan = document.getElementById("totalCount");
  let activeCategory = "all";

  function renderGames() {
    const searchTerm = searchInput.value.trim().toLowerCase();
    let filtered = gamesData.filter(game => {
      const matchesSearch = game.name.toLowerCase().includes(searchTerm);
      const matchesCategory = activeCategory === "all" || game.category === activeCategory;
      return matchesSearch && matchesCategory;
    });

    totalSpan.innerText = filtered.length;

    if (filtered.length === 0) {
      container.innerHTML = `<div class="no-results">✨ no games found — try a different search or category ✨</div>`;
      return;
    }

    container.innerHTML = filtered.map(game => {
      const badge = getBadgeText(game.name);
      return `
        <a href="${game.link}" class="game-btn">
          <div class="game-icon">${game.emoji}</div>
          <div class="game-info">
            <div class="game-title">
              ${escapeHtml(game.name)}
              <span class="game-badge">${badge}</span>
            </div>
            <div class="game-sub">
              <span>🎮 ${game.category.charAt(0).toUpperCase() + game.category.slice(1)}</span>
              <span class="arrow-hint">▶ play</span>
            </div>
          </div>
        </a>
      `;
    }).join('');
  }

  // simple XSS escape
  function escapeHtml(str) {
    return str.replace(/[&<>]/g, function(m) {
      if (m === '&') return '&amp;';
      if (m === '<') return '&lt;';
      if (m === '>') return '&gt;';
      return m;
    }).replace(/[\uD800-\uDBFF][\uDC00-\uDFFF]/g, function(c) {
      return c;
    });
  }

  // category filter + active style
  function initCategories() {
    const btns = document.querySelectorAll(".cat-chip");
    btns.forEach(btn => {
      btn.addEventListener("click", () => {
        btns.forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        activeCategory = btn.getAttribute("data-cat");
        renderGames();
      });
    });
  }

  // debounced search
  let debounceTimer;
  searchInput.addEventListener("input", () => {
    clearTimeout(debounceTimer);
    debounceTimer = setTimeout(() => {
      renderGames();
    }, 280);
  });

  // initial render
  renderGames();
  initCategories();
</script>
</body>
</html>
